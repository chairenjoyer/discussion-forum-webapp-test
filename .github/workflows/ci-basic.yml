name: Basic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest
          else
            echo "pytest not installed or no tests yet - skipping"
          fi

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r . -ll -ii -f txt -o bandit-report.txt

      - name: Show Bandit report in logs
        if: always()
        run: |
          echo "===== BANDIT REPORT START ====="
          cat bandit-report.txt || echo "Brak pliku bandit-report.txt"
          echo "===== BANDIT REPORT END ====="

      - name: Upload Bandit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  build-image:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "Buduję obraz Dockera z Dockerfile..."
          docker build -t my-app-ci-image:latest forum_proj
