name: Basic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # zmień, jeśli używasz innej wersji Pythona

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest
          else
            echo "pytest not installed or no tests yet - skipping"
          fi

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Bandit SAST scan
        run: |
          # -r .    -> skanuj rekursywnie cały projekt
          # -ll     -> log level: tylko ważniejsze rzeczy
          # -ii     -> pokaż tylko istotne (medium/high confidence)
          # -f txt  -> format raportu: tekst
          # -o ...  -> zapisz raport do pliku
          bandit -r . -ll -ii -f txt -o bandit-report.txt
