name: Basic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          if command -v pytest >/dev/null 2>&1; then
            pytest
          else
            echo "pytest not installed or no tests yet - skipping"
          fi

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Bandit SAST scan
        run: |
          bandit -r . -ll -ii -f txt -o bandit-report.txt

      - name: Show Bandit report in logs
        if: always()
        run: |
          echo "===== BANDIT REPORT START ====="
          cat bandit-report.txt || echo "Brak pliku bandit-report.txt"
          echo "===== BANDIT REPORT END ====="

      - name: Upload Bandit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  aws-connection-test:
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # wymagane, żeby pobrać token OIDC
      contents: read       # standardowe minimum

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::666524608350:role/github-actions-eks-role
          aws-region: eu-north-1

      - name: Test AWS connection (STS GetCallerIdentity)
        run: |
          echo "Wywołuję aws sts get-caller-identity..."
          aws sts get-caller-identity


  build-image:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "Buduję obraz Dockera z Dockerfile..."
          docker build -t my-app-ci-image:latest forum_proj

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: my-app-ci-image:latest   # ta sama nazwa, co w docker build
          format: 'table'                     # czytelny raport w logach
          exit-code: '0'                      # na razie NIE psujemy pipeline’u
          ignore-unfixed: true                # pomijaj podatności bez fixa
          vuln-type: 'os,library'             # system + biblioteki
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
