name: CI-CD-Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security_checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for MariaDB
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev libmariadb-dev-compat

      - name: Install Python dependencies + security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run SAST with Bandit
        run: bandit -r .

      - name: Check dependencies with pip-audit
        run: pip-audit

  build_docker:
    needs: security_checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t my-django-app:${{ github.sha }} .

  deploy:
    if: github.event_name == 'push'
    needs: build_docker
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://twoja-apka.example.com

    steps:
      - name: Deploy (placeholder)
        run: |
          echo "Tutaj normalnie byłaby komenda deployu (np. na AWS / serwer)"
